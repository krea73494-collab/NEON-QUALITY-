<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Required for FFmpeg.wasm -->
  <script src="coi-serviceworker.js"></script>

  <title>NEON QUALITY</title>

  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 10%, rgba(255, 30, 60, .22), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(255, 0, 40, .15), transparent 35%),
        #090909;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .glass {
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.14);
      box-shadow:
        0 20px 60px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.08);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 28px;
      padding: 28px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .logo span {
      color: #ff1738;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .drop {
      border: 1px dashed rgba(255,255,255,.28);
      border-radius: 22px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      background: rgba(255,255,255,.035);
      transition: .2s;
    }

    .drop:hover {
      border-color: #ff1738;
      background: rgba(255,23,56,.07);
    }

    .drop-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .drop-text {
      color: #999;
      font-size: 13px;
    }

    #fileInput {
      display: none;
    }

    .file-info {
      display: none;
      margin-top: 18px;
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.06);
    }

    .file-name {
      font-size: 14px;
      word-break: break-all;
      font-weight: bold;
    }

    .file-size {
      margin-top: 5px;
      color: #999;
      font-size: 12px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 17px;
      padding: 16px;
      margin-top: 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    #prepareBtn {
      background: #ff1738;
      color: white;
    }

    #prepareBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 30px rgba(255,23,56,.25);
    }

    #prepareBtn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    #downloadBtn {
      display: none;
      background: white;
      color: #111;
    }

    .status {
      margin-top: 18px;
      text-align: center;
      color: #bbb;
      font-size: 13px;
      line-height: 1.5;
      min-height: 20px;
    }

    .details {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.1);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 7px 0;
      font-size: 12px;
    }

    .detail-row span:first-child {
      color: #888;
    }

    .detail-row span:last-child {
      text-align: right;
      font-weight: bold;
    }

    .note {
      margin-top: 20px;
      text-align: center;
      color: #777;
      font-size: 11px;
      line-height: 1.5;
    }

    .red {
      color: #ff1738;
    }
  </style>
</head>

<body>

<div class="app">
  <div class="glass">

    <div class="logo">
      NEON <span>QUALITY</span>
    </div>

    <div class="subtitle">
      TikTok Video Preparation
    </div>

    <label class="drop" for="fileInput">
      <div class="drop-title">SELECT VIDEO</div>
      <div class="drop-text">
        Tap here to choose your MP4 video
      </div>
    </label>

    <input
      id="fileInput"
      type="file"
      accept="video/mp4,video/*"
    >

    <div class="file-info" id="fileInfo">
      <div class="file-name" id="fileName"></div>
      <div class="file-size" id="fileSize"></div>
    </div>

    <button id="prepareBtn" disabled>
      PREPARE VIDEO
    </button>

    <button id="downloadBtn">
      DOWNLOAD VIDEO
    </button>

    <div class="status" id="status">
      Select a video to begin.
    </div>

    <div class="details">
      <div class="detail-row">
        <span>Video processing</span>
        <span class="red">REMUX</span>
      </div>

      <div class="detail-row">
        <span>Video re-encode</span>
        <span>NO</span>
      </div>

      <div class="detail-row">
        <span>Resolution</span>
        <span>KEEP SOURCE</span>
      </div>

      <div class="detail-row">
        <span>FPS</span>
        <span>KEEP SOURCE</span>
      </div>

      <div class="detail-row">
        <span>Video codec</span>
        <span>COPY</span>
      </div>

      <div class="detail-row">
        <span>Audio codec</span>
        <span>COPY</span>
      </div>

      <div class="detail-row">
        <span>MP4</span>
        <span>FASTSTART</span>
      </div>
    </div>

    <div class="note">
      NEON QUALITY processes the video locally in your browser.
      <br>
      No video is uploaded to a server.
    </div>

  </div>
</div>

<script>
  const { createFFmpeg, fetchFile } = FFmpeg;

  const ffmpeg = createFFmpeg({
    log: false,
    corePath:
      "https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js"
  });

  const fileInput = document.getElementById("fileInput");
  const prepareBtn = document.getElementById("prepareBtn");
  const downloadBtn = document.getElementById("downloadBtn");

  const fileInfo = document.getElementById("fileInfo");
  const fileName = document.getElementById("fileName");
  const fileSize = document.getElementById("fileSize");
  const status = document.getElementById("status");

  let selectedFile = null;
  let outputBlob = null;
  let outputUrl = null;

  function formatSize(bytes) {
    if (bytes < 1024 * 1024) {
      return (bytes / 1024).toFixed(1) + " KB";
    }

    return (bytes / 1024 / 1024).toFixed(2) + " MB";
  }

  fileInput.addEventListener("change", function () {

    if (!this.files || !this.files[0]) {
      return;
    }

    selectedFile = this.files[0];

    fileName.textContent = selectedFile.name;
    fileSize.textContent = formatSize(selectedFile.size);

    fileInfo.style.display = "block";

    prepareBtn.disabled = false;
    downloadBtn.style.display = "none";

    status.textContent = "Ready to prepare video.";

    outputBlob = null;

    if (outputUrl) {
      URL.revokeObjectURL(outputUrl);
      outputUrl = null;
    }
  });


  prepareBtn.addEventListener("click", async function () {

    if (!selectedFile) {
      return;
    }

    prepareBtn.disabled = true;
    downloadBtn.style.display = "none";

    try {

      status.textContent = "Loading video engine...";

      if (!ffmpeg.isLoaded()) {
        await ffmpeg.load();
      }

      /*
       * IMPORTANT:
       *
       * -c:v copy
       *     Do NOT re-encode the H.264 video.
       *
       * -c:a copy
       *     Do NOT re-encode AAC audio.
       *
       * -map 0:v:0
       *     Keep the first video stream.
       *
       * -map 0:a?
       *     Keep available audio streams.
       *
       * -map_metadata 0
       *     Preserve source metadata.
       *
       * +faststart
       *     Move MP4 moov atom for progressive playback.
       */

      const inputName = "input.mp4";
      const outputName = "NEON_QUALITY.mp4";

      status.textContent = "Preparing video...";

      ffmpeg.FS(
        "writeFile",
        inputName,
        await fetchFile(selectedFile)
      );

      await ffmpeg.run(
        "-i",
        inputName,

        "-map",
        "0:v:0",

        "-map",
        "0:a?",

        "-c:v",
        "copy",

        "-c:a",
        "copy",

        "-map_metadata",
        "0",

        "-movflags",
        "+faststart",

        "-f",
        "mp4",

        outputName
      );

      status.textContent = "Finalizing MP4...";

      const data = ffmpeg.FS(
        "readFile",
        outputName
      );

      outputBlob = new Blob(
        [data.buffer],
        { type: "video/mp4" }
      );

      outputUrl = URL.createObjectURL(outputBlob);

      /*
       * Clean FFmpeg memory
       */
      try {
        ffmpeg.FS("unlink", inputName);
      } catch (e) {}

      try {
        ffmpeg.FS("unlink", outputName);
      } catch (e) {}

      status.innerHTML =
        "✓ Video prepared successfully.<br>" +
        "Original video stream was copied without re-encoding.";

      downloadBtn.style.display = "block";

    } catch (error) {

      console.error(error);

      status.textContent =
        "Processing failed. Please try another MP4 video.";

    } finally {

      prepareBtn.disabled = false;

    }

  });


  downloadBtn.addEventListener("click", function () {

    if (!outputUrl) {
      return;
    }

    const a = document.createElement("a");

    a.href = outputUrl;
    a.download = "NEON_QUALITY.mp4";

    document.body.appendChild(a);

    a.click();

    a.remove();

  });

</script>

</body>
</html>
