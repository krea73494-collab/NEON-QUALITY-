<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok HD Video Optimizer</title>
  
  <!-- GitHub Pages တွင် SharedArrayBuffer / FFmpeg.wasm အလုပ်လုပ်စေရန် COOP/COEP Header Injector -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/coi-serviceworker/0.1.7/coi-serviceworker.min.js"></script>

  <!-- FFmpeg.wasm v0.11.6 CDN -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: #1e293b;
      width: 100%;
      max-width: 480px;
      padding: 30px 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 8px;
      color: #00f2fe;
    }
    p.subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .upload-area {
      border: 2px dashed #334155;
      padding: 30px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: 0.2s;
      background: #0f172a;
    }
    .upload-area:hover {
      border-color: #00f2fe;
    }
    input[type="file"] { display: none; }
    .btn {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      font-weight: bold;
      padding: 12px 24px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 10px;
      cursor: pointer;
      font-size: 14px;
    }
    .progress-box {
      margin-top: 24px;
      display: none;
    }
    .progress-bar-bg {
      background: #334155;
      height: 10px;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 8px;
    }
    .progress-bar-fill {
      background: #22c55e;
      height: 100%;
      width: 0%;
      transition: width 0.3s ease;
    }
    #status {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 10px;
      word-break: break-word;
    }
    .dl-btn {
      display: none;
      background: #22c55e;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
      padding: 14px 28px;
      border-radius: 8px;
      margin-top: 20px;
      font-size: 15px;
      width: 100%;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>TikTok HD Optimizer</h1>
    <p class="subtitle">ဗီဒီယို မဝါးဘဲ ကြည်လင်သွားစေသည့် Sharpening & 60FPS Presets</p>

    <label for="videoInput">
      <div class="upload-area">
        <p style="font-size: 14px; color: #cbd5e1;">ဗီဒီယို ရွေးချယ်ရန် နှိပ်ပါ</p>
        <span class="btn">Video File ရွေးမည်</span>
      </div>
    </label>
    <input type="file" id="videoInput" accept="video/*" onchange="processVideo()">

    <div class="progress-box" id="progressBox">
      <div id="status">FFmpeg Core Engine ရယူနေပါသည်...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <a id="downloadBtn" class="dl-btn" href="#" download="tiktok_hd_video.mp4">HD Video ဒေါင်းလုဒ်ဆွဲရန်</a>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({
      log: true,
      corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    async function processVideo() {
      const input = document.getElementById('videoInput');
      const file = input.files[0];
      if (!file) return;

      const progressBox = document.getElementById('progressBox');
      const progressBar = document.getElementById('progressBar');
      const status = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadBtn');

      progressBox.style.display = 'block';
      downloadBtn.style.display = 'none';
      progressBar.style.width = '0%';
      status.innerText = 'FFmpeg Engine ကို စတင်တင်ယူနေပါသည်...';

      try {
        if (!ffmpeg.isLoaded()) {
          await ffmpeg.load();
        }

        status.innerText = 'ဗီဒီယိုဖိုင်ကို စစ်ဆေးနေပါသည်...';

        ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

        ffmpeg.setProgress(({ ratio }) => {
          const percent = Math.round(ratio * 100);
          if (percent >= 0 && percent <= 100) {
            progressBar.style.width = percent + '%';
            status.innerText = `HD Preset ဖြင့် Compress/Optimize လုပ်နေသည်: ${percent}%`;
          }
        });

        status.innerText = 'Compressing & Sharpening ပြုလုပ်နေသည်... (ခဏစောင့်ပါ)';

        // ပြင်ဆင်ထားသော FFmpeg Arguments
        await ffmpeg.run(
          '-i', 'input.mp4',
          '-vf', 'scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black,unsharp=5:5:1.0:5:5:0.0',
          '-c:v', 'libx264',
          '-profile:v', 'high',
          '-level:v', '4.2',
          '-crf', '18',
          '-preset', 'ultrafast',
          '-r', '60',
          '-g', '120',
          '-b:v', '12M',
          '-maxrate', '14M', // Separated parameter
          '-bufsize', '28M', // Separated parameter
          '-pix_fmt', 'yuv420p',
          '-c:a', 'aac',
          '-b:a', '192k',
          'output.mp4'
        );

        status.innerText = 'Convert လုပ်ခြင်း အောင်မြင်ပါပြီ!';
        progressBar.style.width = '100%';

        const data = ffmpeg.FS('readFile', 'output.mp4');
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);

        downloadBtn.href = videoUrl;
        downloadBtn.style.display = 'block';

      } catch (error) {
        console.error("FFmpeg Error:", error);
        status.innerText = 'Error: ' + (error.message || 'Convert လုပ်ရာတွင် အမှားအယွင်း ရှိပါသည်။');
      }
    }
  </script>
</body>
</html>
        <p style="font-size: 14px; color: #cbd5e1;">ဗီဒီယို ရွေးချယ်ရန် နှိပ်ပါ</p>
        <span class="btn">Video File ရွေးမည်</span>
      </div>
    </label>
    <input type="file" id="videoInput" accept="video/*" onchange="processVideo()">

    <div class="progress-box" id="progressBox">
      <div id="status">FFmpeg Core Engine ရယူနေပါသည်...</div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <a id="downloadBtn" class="dl-btn" href="#" download="tiktok_hd_video.mp4">HD Video ဒေါင်းလုဒ်ဆွဲရန်</a>
  </div>

  <script>
    const { createFFmpeg, fetchFile } = FFmpeg;
    const ffmpeg = createFFmpeg({
      log: true,
      corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
    });

    async function processVideo() {
      const input = document.getElementById('videoInput');
      const file = input.files[0];
      if (!file) return;

      const progressBox = document.getElementById('progressBox');
      const progressBar = document.getElementById('progressBar');
      const status = document.getElementById('status');
      const downloadBtn = document.getElementById('downloadBtn');

      progressBox.style.display = 'block';
      downloadBtn.style.display = 'none';
      progressBar.style.width = '0%';
      status.innerText = 'FFmpeg Engine ကို စတင်တင်ယူနေပါသည်...';

      try {
        // FFmpeg Core မတင်ရသေးပါက တင်ခြင်း
        if (!ffmpeg.isLoaded()) {
          await ffmpeg.load();
        }

        status.innerText = 'ဗီဒီယိုဖိုင်ကို စစ်ဆေးနေပါသည်...';

        // FFmpeg ရဲ့ Virtual FileSystem ထဲသို့ ဗီဒီယို ထည့်ခြင်း
        ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));

        // Progress အလိုက် Bar ကို မြှင့်ပေးခြင်း
        ffmpeg.setProgress(({ ratio }) => {
          const percent = Math.round(ratio * 100);
          if (percent >= 0 && percent <= 100) {
            progressBar.style.width = percent + '%';
            status.innerText = `HD Preset ဖြင့် Compress/Optimize လုပ်နေသည်: ${percent}%`;
          }
        });

        status.innerText = 'Compressing & Sharpening ပြုလုပ်နေသည်... (ခဏစောင့်ပါ)';

        // TikTok HD Optimizer FFmpeg Commands (Sharpening + GOP + Bitrate control)
        await ffmpeg.run(
          '-i', 'input.mp4',
          '-vf', 'scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black,unsharp=5:5:1.0:5:5:0.0',
          '-c:v', 'libx264',
          '-profile:v', 'high',
          '-level:v', '4.2',
          '-crf', '18',
          '-preset', 'ultrafast',  // Browser ပေါ်တွင် မြန်ဆန်စေရန် ultrafast/superfast သုံးထားပါသည်
          '-r', '60',
          '-g', '120',
          '-b:v', '12M',
          '-maxrate 14M',
          '-bufsize 28M',
          '-pix_fmt', 'yuv420p',
          '-c:a', 'aac',
          '-b:a', '192k',
          'output.mp4'
        );

        status.innerText = 'Convert လုပ်ခြင်း အောင်မြင်ပါပြီ!';
        progressBar.style.width = '100%';

        // ထွက်လာသော ဖိုင်ကို ယူပြီး Download Link ပြုလုပ်ခြင်း
        const data = ffmpeg.FS('readFile', 'output.mp4');
        const videoBlob = new Blob([data.buffer], { type: 'video/mp4' });
        const videoUrl = URL.createObjectURL(videoBlob);

        downloadBtn.href = videoUrl;
        downloadBtn.style.display = 'block';

      } catch (error) {
        console.error(error);
        status.innerText = 'Error: Convert လုပ်ရာတွင် အမှားအယွင်း ရှိပါသည်။';
      }
    }
  </script>
</body>
</html>
