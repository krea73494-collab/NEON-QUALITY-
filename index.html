<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEON QUALITY — B</title>

  <script src="./coi-serviceworker.js"></script>
  <script src="./ffmpeg-core.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;

      background:
        radial-gradient(
          circle at 10% 10%,
          rgba(255, 0, 60, .22),
          transparent 35%
        ),
        radial-gradient(
          circle at 90% 90%,
          rgba(255, 255, 255, .08),
          transparent 35%
        ),
        #080808;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .app {
      width: 100%;
      max-width: 520px;
    }

    .glass {
      padding: 25px;
      border-radius: 28px;

      background: rgba(255,255,255,.075);

      border: 1px solid rgba(255,255,255,.15);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        0 25px 70px rgba(0,0,0,.55),
        inset 0 1px 0 rgba(255,255,255,.12);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .logo span {
      color: #ff1744;
    }

    .subtitle {
      margin-top: 7px;
      text-align: center;
      color: #888;
      font-size: 11px;
      letter-spacing: 1.2px;
    }

    .badge {
      width: fit-content;
      margin: 14px auto 0;
      padding: 6px 13px;

      border-radius: 999px;

      color: #ff4b6d;
      background: rgba(255,23,68,.1);
      border: 1px solid rgba(255,23,68,.3);

      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .upload {
      display: block;

      margin-top: 24px;
      padding: 32px 18px;

      border-radius: 21px;

      border: 1px dashed rgba(255,255,255,.22);

      background: rgba(255,255,255,.035);

      text-align: center;
      cursor: pointer;

      transition: .2s;
    }

    .upload:hover {
      border-color: rgba(255,23,68,.8);
      background: rgba(255,23,68,.05);
    }

    .plus {
      width: 58px;
      height: 58px;

      margin: auto;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      color: #ff1744;

      background: rgba(255,23,68,.1);

      border: 1px solid rgba(255,23,68,.3);

      font-size: 32px;
    }

    .upload-title {
      margin-top: 13px;
      font-size: 16px;
      font-weight: 800;
    }

    .upload-info {
      margin-top: 7px;
      color: #777;
      font-size: 11px;
    }

    #videoInput {
      display: none;
    }

    .file {
      display: none;

      margin-top: 14px;
      padding: 13px;

      border-radius: 14px;

      background: rgba(255,255,255,.05);

      border: 1px solid rgba(255,255,255,.08);
    }

    .file-title {
      color: #777;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .file-name {
      margin-top: 5px;
      font-size: 12px;
      font-weight: 700;
      word-break: break-all;
    }

    .file-size {
      margin-top: 4px;
      color: #777;
      font-size: 10px;
    }

    button {
      width: 100%;

      margin-top: 17px;
      padding: 16px;

      border: 0;
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          #ff1744,
          #d50035
        );

      color: white;

      font-size: 15px;
      font-weight: 900;

      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: .35;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      color: #aaa;

      font-size: 12px;

      line-height: 1.5;

      word-break: break-word;
    }

    .progress {
      display: none;

      height: 7px;

      margin-top: 10px;

      overflow: hidden;

      border-radius: 99px;

      background: rgba(255,255,255,.08);
    }

    .bar {
      width: 0%;
      height: 100%;

      background: #ff1744;

      border-radius: 99px;

      transition: width .15s linear;
    }

    .error {
      display: none;

      margin-top: 13px;
      padding: 12px;

      border-radius: 13px;

      background: rgba(255,0,50,.08);

      border: 1px solid rgba(255,0,50,.25);

      color: #ff8097;

      font-size: 10px;

      line-height: 1.5;

      word-break: break-word;
    }

    .download {
      display: none;
      margin-top: 14px;
    }

    .download a {
      display: block;

      padding: 15px;

      border-radius: 15px;

      background: white;
      color: #111;

      text-align: center;

      text-decoration: none;

      font-size: 14px;
      font-weight: 900;
    }

    .settings {
      margin-top: 22px;
      padding: 16px;

      border-radius: 18px;

      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,255,255,.07);
    }

    .settings-title {
      margin-bottom: 11px;

      font-size: 12px;
      font-weight: 900;
    }

    .row {
      display: flex;
      justify-content: space-between;

      gap: 15px;

      margin: 8px 0;

      font-size: 10px;
    }

    .row span:first-child {
      color: #777;
    }

    .row span:last-child {
      color: #ddd;
      text-align: right;
    }

    .footer {
      margin-top: 15px;

      text-align: center;

      color: #555;

      font-size: 9px;

      line-height: 1.5;
    }

    @media (max-width: 420px) {
      .glass {
        padding: 20px;
        border-radius: 23px;
      }

      .logo {
        font-size: 26px;
      }

      .upload {
        padding: 27px 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="glass">

    <div class="logo">
      NEON <span>QUALITY</span>
    </div>

    <div class="subtitle">
      HIGH QUALITY VIDEO PROCESSOR
    </div>

    <div class="badge">
      B MODE
    </div>

    <label
      class="upload"
      for="videoInput"
    >
      <div class="plus">+</div>

      <div class="upload-title">
        Select Video
      </div>

      <div class="upload-info">
        MP4 • MOV • MKV • WebM
      </div>
    </label>

    <input
      id="videoInput"
      type="file"
      accept="video/*"
    >

    <div
      id="fileBox"
      class="file"
    >
      <div class="file-title">
        Selected Video
      </div>

      <div
        id="fileName"
        class="file-name"
      ></div>

      <div
        id="fileSize"
        class="file-size"
      ></div>
    </div>

    <button
      id="prepareBtn"
      disabled
    >
      Prepare B Video
    </button>

    <div
      id="status"
      class="status"
    >
      Select a video first
    </div>

    <div
      id="progress"
      class="progress"
    >
      <div
        id="progressBar"
        class="bar"
      ></div>
    </div>

    <div
      id="errorBox"
      class="error"
    ></div>

    <div
      id="downloadBox"
      class="download"
    >
      <a
        id="downloadLink"
        href="#"
        download="NEON_QUALITY_B.mp4"
      >
        Download B Video
      </a>
    </div>

    <div class="settings">

      <div class="settings-title">
        B MODE SETTINGS
      </div>

      <div class="row">
        <span>Codec</span>
        <span>H.264 High</span>
      </div>

      <div class="row">
        <span>Quality</span>
        <span>CRF 16</span>
      </div>

      <div class="row">
        <span>Preset</span>
        <span>Slow</span>
      </div>

      <div class="row">
        <span>Resolution</span>
        <span>Source</span>
      </div>

      <div class="row">
        <span>FPS</span>
        <span>Source</span>
      </div>

      <div class="row">
        <span>Pixel Format</span>
        <span>YUV420P</span>
      </div>

      <div class="row">
        <span>Audio</span>
        <span>AAC 192k</span>
      </div>

      <div class="row">
        <span>Container</span>
        <span>MP4</span>
      </div>

      <div class="row">
        <span>Fast Start</span>
        <span>Enabled</span>
      </div>

    </div>

    <div class="footer">
      B mode keeps source resolution and FPS.
    </div>

  </div>

</div>

<script type="module">

import {
  createFFmpeg,
  fetchFile
} from "./ffmpeg.js";


const videoInput =
  document.getElementById("videoInput");

const prepareBtn =
  document.getElementById("prepareBtn");

const fileBox =
  document.getElementById("fileBox");

const fileName =
  document.getElementById("fileName");

const fileSize =
  document.getElementById("fileSize");

const status =
  document.getElementById("status");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");

const errorBox =
  document.getElementById("errorBox");

const downloadBox =
  document.getElementById("downloadBox");

const downloadLink =
  document.getElementById("downloadLink");


let selectedFile = null;
let outputUrl = null;
let ffmpeg = null;


function formatBytes(bytes) {

  if (!bytes) {
    return "0 Bytes";
  }

  const units = [
    "Bytes",
    "KB",
    "MB",
    "GB"
  ];

  const index =
    Math.floor(
      Math.log(bytes) /
      Math.log(1024)
    );

  return (
    (
      bytes /
      Math.pow(1024, index)
    ).toFixed(2)
    + " "
    + units[index]
  );
}


function createEngine() {

  if (ffmpeg) {
    return ffmpeg;
  }

  ffmpeg = createFFmpeg({
    log: true,
    corePath: "./ffmpeg-core.js"
  });

  ffmpeg.setProgress(
    ({ ratio }) => {

      if (
        typeof ratio !== "number" ||
        !isFinite(ratio)
      ) {
        return;
      }

      const percent =
        Math.max(
          0,
          Math.min(
            100,
            Math.round(ratio * 100)
          )
        );

      progressBar.style.width =
        percent + "%";

      status.textContent =
        "Encoding B video... "
        + percent
        + "%";
    }
  );

  return ffmpeg;
}


videoInput.addEventListener(
  "change",
  () => {

    selectedFile =
      videoInput.files &&
      videoInput.files[0]
        ? videoInput.files[0]
        : null;

    errorBox.style.display =
      "none";

    downloadBox.style.display =
      "none";

    if (outputUrl) {

      URL.revokeObjectURL(
        outputUrl
      );

      outputUrl = null;
    }

    if (!selectedFile) {

      fileBox.style.display =
        "none";

      prepareBtn.disabled =
        true;

      status.textContent =
        "Select a video first";

      return;
    }

    fileBox.style.display =
      "block";

    fileName.textContent =
      selectedFile.name;

    fileSize.textContent =
      formatBytes(
        selectedFile.size
      );

    prepareBtn.disabled =
      false;

    status.textContent =
      "Ready — B mode";
  }
);


prepareBtn.addEventListener(
  "click",
  async () => {

    if (!selectedFile) {
      return;
    }

    prepareBtn.disabled =
      true;

    errorBox.style.display =
      "none";

    downloadBox.style.display =
      "none";

    progress.style.display =
      "block";

    progressBar.style.width =
      "0%";

    try {

      if (
        typeof window.createFFmpegCore ===
        "undefined"
      ) {

        throw new Error(
          "ffmpeg-core.js did not create window.createFFmpegCore"
        );
      }


      const engine =
        createEngine();


      if (!engine.isLoaded()) {

        status.textContent =
          "Loading FFmpeg...";

        await engine.load();
      }


      status.textContent =
        "FFmpeg ready";


      const inputName =
        "NEON_INPUT.mp4";

      const outputName =
        "NEON_QUALITY_B.mp4";


      status.textContent =
        "Reading video...";


      engine.FS(
        "writeFile",
        inputName,
        await fetchFile(
          selectedFile
        )
      );


      export function buildRemuxArgs(
  inputName: string,
  outputName: string
): string[] {
  return [
    "-i", inputName,

    // Original video ကို လုံးဝမပြန် encode
    "-map", "0:v:0",
    "-c:v", "copy",

    // Original audio ကို copy
    "-map", "0:a:0?",
    "-c:a", "copy",

    // MP4 compatibility
    "-map_metadata", "0",
    "-movflags", "+faststart",

    // MP4 output
    "-f", "mp4",

    outputName,
  ];
}


      status.textContent =
        "Encoding B video...";


      await engine.run(
        ...args
      );


      status.textContent =
        "Preparing download...";


      const data =
        engine.FS(
          "readFile",
          outputName
        );


      const blob =
        new Blob(
          [data.buffer],
          {
            type:
              "video/mp4"
          }
        );


      outputUrl =
        URL.createObjectURL(
          blob
        );


      downloadLink.href =
        outputUrl;

      downloadLink.download =
        "NEON_QUALITY_B.mp4";


      downloadBox.style.display =
        "block";


      progressBar.style.width =
        "100%";


      status.textContent =
        "B video ready ✓";


      try {
        engine.FS(
          "unlink",
          inputName
        );
      } catch (_) {}


      try {
        engine.FS(
          "unlink",
          outputName
        );
      } catch (_) {}


    } catch (error) {

      console.error(
        "NEON QUALITY B ERROR:",
        error
      );

      errorBox.style.display =
        "block";

      errorBox.textContent =
        "FFmpeg Error: " +
        (
          error?.message ||
          String(error)
        );

      status.textContent =
        "B processing failed";


    } finally {

      prepareBtn.disabled =
        false;
    }
  }
);

</script>

</body>
</html>
