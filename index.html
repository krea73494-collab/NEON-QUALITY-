<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEON QUALITY — TikTok Video Quality Optimizer</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#050508;color:#fff;display:grid;place-items:center;padding:20px} .app{width:min(720px,100%);padding:28px;border:1px solid #292936;border-radius:24px;background:#0b0b12;box-shadow:0 0 45px rgba(0,255,255,.08)}h1{margin:0;font-size:34px;letter-spacing:2px} .sub{color:#9b9baa;margin:8px 0 25px}.drop{border:2px dashed #333344;border-radius:18px;padding:38px 20px;text-align:center;cursor:pointer}.drop:hover{border-color:#7777aa}.drop input{display:none}.btn{width:100%;border:0;border-radius:12px;padding:14px;margin-top:16px;background:#fff;color:#000;font-weight:700;font-size:16px;cursor:pointer}.btn:disabled{opacity:.4;cursor:not-allowed}.info{display:none;margin-top:18px;padding:15px;border-radius:14px;background:#11111a;color:#c9c9d4;line-height:1.7}.progress{display:none;margin-top:18px}.bar{height:10px;border-radius:99px;background:#1b1b27;overflow:hidden}.fill{height:100%;width:0;background:#fff;transition:width .15s}.status{margin-top:8px;color:#aaa}.download{display:none;margin-top:18px;text-align:center}.download a{display:inline-block;padding:13px 20px;border-radius:12px;background:#fff;color:#000;text-decoration:none;font-weight:700}.note{margin-top:22px;font-size:12px;color:#777;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="app">
  <h1>NEON QUALITY</h1>
  <div class="sub">TikTok Video Quality Optimizer</div>
  <label class="drop" id="drop">📁<br><br>Choose a video<br><small>MP4 / MOV / WEBM</small><input id="file" type="file" accept="video/*"></label>
  <div class="info" id="info"></div>
  <button class="btn" id="start" disabled>PREPARE VIDEO</button>
  <div class="progress" id="progress"><div class="bar"><div class="fill" id="fill"></div></div><div class="status" id="status">Preparing…</div></div>
  <div class="download" id="download"></div>
  <div class="note">Remux only: video/audio streams are copied without re-encoding. TikTok may still apply its own server-side compression after upload.</div>
</div>
<script type="module">
import { createFFmpeg } from './encoder/ffmpeg.js';

const $ = id => document.getElementById(id);
const fileInput=$('file'), drop=$('drop'), start=$('start'), info=$('info');
const progress=$('progress'), fill=$('fill'), status=$('status'), download=$('download');
let selectedFile=null, ffmpeg=null, loaded=false;

function threads(){return Math.max(1,Math.floor((navigator.hardwareConcurrency||4)/2));}
function inputName(file){
  const m=file.name.match(/\.([^.]+)$/); return 'input.'+(m?m[1].toLowerCase():'mp4');
}
function setProgress(v,text){fill.style.width=Math.min(100,Math.max(0,v*100))+'%';status.textContent=text;}

async function loadFFmpeg(){
  if(loaded)return;
  status.textContent='Loading video engine…';
  ffmpeg=createFFmpeg({
    log:false,
    corePath:'./encoder/core/ffmpeg-core.js',
    wasmPath:'./encoder/core/ffmpeg-core.wasm',
    workerPath:'./encoder/core/ffmpeg-core.worker.js',
    progress:({ratio})=>{ if(Number.isFinite(ratio)) setProgress(ratio,'Preparing video… '+Math.round(ratio*100)+'%'); }
  });
  await ffmpeg.load(); loaded=true;
}

function choose(file){
  if(!file || !file.type.startsWith('video/'))return;
  selectedFile=file; start.disabled=false; download.style.display='none';
  info.style.display='block';
  info.innerHTML=`<b>File:</b> ${file.name}<br><b>Size:</b> ${(file.size/1048576).toFixed(2)} MB`;
}
fileInput.addEventListener('change',e=>choose(e.target.files[0]));
drop.addEventListener('dragover',e=>{e.preventDefault();});
drop.addEventListener('drop',e=>{e.preventDefault();choose(e.dataTransfer.files[0]);});

start.addEventListener('click',async()=>{
  if(!selectedFile)return;
  start.disabled=true; progress.style.display='block'; download.style.display='none'; setProgress(0,'Starting…');
  const inName=inputName(selectedFile), outName='neon-quality-output.mp4';
  try{
    await loadFFmpeg();
    const bytes=new Uint8Array(await selectedFile.arrayBuffer());
    ffmpeg.FS('writeFile',inName,bytes);
    // IMPORTANT: no re-encode. Original streams are copied exactly.
    const args=['-i',inName,'-map','0:v:0','-map','0:a?','-c','copy','-movflags','+faststart','-map_metadata','0','-threads',String(threads()),outName];
    await ffmpeg.run(...args);
    const data=ffmpeg.FS('readFile',outName);
    if(!data || !data.byteLength)throw new Error('Output file is empty.');
    const blob=new Blob([data],{type:'video/mp4'});
    const url=URL.createObjectURL(blob);
    const base=selectedFile.name.replace(/\.[^.]+$/,'');
    const name=base+'-NEON-QUALITY.mp4';
    download.style.display='block';
    download.innerHTML=`<a href="${url}" download="${name}">⬇ Download ${name}</a>`;
    info.innerHTML+=`<br><b>Output:</b> ${(blob.size/1048576).toFixed(2)} MB<br><b>Mode:</b> H.264/Audio Copy + MP4 Faststart`;
    setProgress(1,'Done ✓');
    try{ffmpeg.FS('unlink',outName)}catch{}
    try{ffmpeg.FS('unlink',inName)}catch{}
  }catch(err){
    console.error(err); status.textContent='Failed: '+(err?.message||err); setProgress(0,'Failed');
    try{ffmpeg?.FS('unlink',inName)}catch{} try{ffmpeg?.FS('unlink',outName)}catch{}
  }finally{start.disabled=false;}
});
</script>
</body>
</html>
